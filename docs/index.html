<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrypterChat WebApp — Screenshots</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0f1220;
      color: #f5f5f7;
    }
    header {
      padding: 48px 24px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { margin: 0; opacity: 0.75; }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 64px;
      display: grid;
      gap: 28px;
    }
    figure {
      margin: 0;
      background: #1a1f35;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 14px 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    a { color: #9db4ff; }
  </style>
</head>
<body>
  <header>
    <h1>CrypterChat WebApp</h1>
    <p>Live screenshots from the running app · <a href="https://github.com/crypterchat/WebApp">GitHub repo</a></p>
  </header>
  <main class="grid">
    <figure>
      <img src="./screenshots/home.png" alt="Home" />
      <figcaption>Home</figcaption>
    </figure>
    <figure>
      <img src="./screenshots/landing.png" alt="Landing" />
      <figcaption>Landing</figcaption>
    </figure>
    <figure>
      <img src="./screenshots/login.png" alt="Login" />
      <figcaption>Login</figcaption>
    </figure>
    <figure>
      <img src="./screenshots/api-key.png" alt="API Keys" />
      <figcaption>API Keys</figcaption>
    </figure>
    <figure>
      <img src="./screenshots/server.png" alt="Server Setup" />
      <figcaption>Server Setup</figcaption>
    </figure>
    <figure>
      <img src="./screenshots/chatscan.png" alt="ChatScan" />
      <figcaption>ChatScan</figcaption>
    </figure>
    <figure>
      <img src="./screenshots/docs.png" alt="Docs" />
      <figcaption>Docs</figcaption>
    </figure>
    <figure>
      <img src="./screenshots/blog.png" alt="Blog" />
      <figcaption>Blog</figcaption>
    </figure>
  </main>
</body>
</html>
